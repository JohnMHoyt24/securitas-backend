spring.application.name=securitas-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

security.jwt.secret=${JWT_SECRET}
gemini.api.key=${GEMINI_API_KEY}

# Origins allowed to call this API cross-origin (the Render-hosted frontend, plus local
# dev). Override via CORS_ALLOWED_ORIGINS if the Render URL ends up different from the
# name reserved in render.yaml.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://securitas-frontend.onrender.com}

management.endpoint.health.show-details=always
management.health.neo4j.enabled=false
